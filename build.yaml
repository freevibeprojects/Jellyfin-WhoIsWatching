framework: "net10.0"
overview: "Netflix-style profile switching from the avatar button in Jellyfin Web"
description: >
  Click your avatar in Jellyfin Web to open a Netflix-style "Who's watching?" screen and switch
  profile. Optional "Remember on this device" (never for administrators; keeps Jellyfin's access
  token, never a password), Manage profiles with a shared picture gallery, brand text, and a
  settings page. Sign-in goes through Jellyfin's own login API, so all of Jellyfin's rules apply.
category: "General"
owner: "freevibeprojects"
artifacts:
  - "Jellyfin.Plugin.WhoIsWatching.dll"
changelog: >
  Profiles without a password sign in with one tap. Administrators can set the profiles' order, who
  may add gallery pictures, and an idle time after which the picker comes back. New in the picker:
  Sign out, Show password, Remove picture, Remove from gallery for your own uploads, a mark on
  profiles remembered on the device, number and letter keys, and P to open it from any page. It starts
  on the profile last signed in. Without "Remember on this device", a sign-in now ends when the
  browser closes. Lighter: the script is served without comments and pre-compressed (28 KB to 15 KB),
  and the gallery loads small thumbnails. Fixes: a wrong password stays to correct, long brand texts
  fit phones, "Saving…" while a picture applies, Not yet after an upload removes it, and gallery
  uploads that hide a huge picture behind a JPEG marker are refused.
