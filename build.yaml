overview: "Netflix-style profile switching from the avatar button in Jellyfin Web"
description: >
  Click your avatar in Jellyfin Web to open a Netflix-style "Who's watching?" screen and switch
  profile. Optional "Remember on this device" (never for administrators; keeps Jellyfin's access
  token, never a password), Manage profiles with a shared picture gallery, brand text, and a
  settings page. Sign-in goes through Jellyfin's own login API, so all of Jellyfin's rules apply.
category: "General"
owner: "freevibeprojects"
artifacts:
  - "Jellyfin.Plugin.WhoIsWatching.dll"
changelog: >
  Other account: sign in to an account hidden from the sign-in screen (such as the administrator's)
  without signing out first. The sign-in picker now appears before Jellyfin's own page, in the
  server's Custom CSS from the start, and after signing in the screen says who is being signed in
  while Jellyfin starts. Opens at once from TV remotes and keyboards, is bigger on TVs, fits big
  households, and works with high contrast and screen readers. Safer: signing out always forgets
  remembered profiles, gallery uploads can't declare huge pictures or tie up server memory, and a
  sign-in can no longer be undone by Jellyfin's start-up.
