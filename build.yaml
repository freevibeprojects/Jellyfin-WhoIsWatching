overview: "Netflix-style profile switching from the avatar button in Jellyfin Web"
description: >
  Click your avatar in Jellyfin Web to open a Netflix-style "Who's watching?" screen and switch
  profile. Optional "Remember on this device" (never for administrators; keeps Jellyfin's access
  token, never a password), Manage profiles with a shared picture gallery, brand text, and a
  settings page. Sign-in goes through Jellyfin's own login API, so all of Jellyfin's rules apply.
category: "General"
owner: "freevibeprojects"
artifacts:
