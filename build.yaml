changelog: >
  The picker now greets you on the sign-in page (first visit, after signing out), with Jellyfin's
  page one tap away for manual sign-in, Quick Connect and Forgot password, and the Login Disclaimer
  shown. It is styled by the active theme like Jellyfin's own pages: Jellyfin's buttons, fields,
  checkbox and card colours, no rounding unless the theme rounds, and the page's own background.
  Switching works where Jellyfin's Remember me was unticked. TV layout: no file picker, clearer
  focus. Each person may add up to 20 gallery pictures, and only whole JPEGs.
