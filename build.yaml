changelog: >
  The picker scales with the screen: the same proportions from phones and 1080p up to 1440p
  and 4K, limited by height on wide or short windows (the brand-text size is now pixels at
  1080p and scales too). Older engines keep the fixed 1080p sizes. Pressing the avatar starts
  loading the profiles, so the picker opens as the click lands.
